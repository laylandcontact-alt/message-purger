name: Build plugin repository

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm ci
            - run: npm run lint:types
            - run: npm run package
            - run: test -f build/dist/message-purger.zip
            - run: test -f docs/index.json
            - run: unzip -t build/dist/message-purger.zip
            - run: unzip -p build/dist/message-purger.zip manifest.json | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => { const m = JSON.parse(s); if (m.format !== 1 || m.id !== "message-purger" || m.dist.script !== "index.js") process.exit(1); })'
            - run: test -f plugins/message-purger/build/js/index.js
            - run: mkdir -p _site && cp -R docs/. _site/
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: _site
    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
